
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz Application</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="quiz-container">
    <h1>Interactive Quiz Application</h1>

    <!-- Score Display -->
    <div id="score-container">
      Score: <span id="score">0</span> / <span id="total">0</span>
    </div>

    <!-- Category Selection -->
    <div id="category-container">
      <label for="category">Select Subject:</label>
      <select id="category">
        <option value="general">General Knowledge</option>
        <option value="science">Science</option>
        <option value="math">Mathematics</option>
      </select>
      <button id="start-btn">Start Quiz</button>
    </div>

    <!-- Quiz Section -->
    <div id="quiz" style="display:none;">
      <div id="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
      <div id="timer">Time Left: <span id="time">15</span>s</div>
      <div id="question-container">
        <div id="question"></div>
        <div id="options"></div>
      </div>
      <button id="next-btn" disabled>Next</button>
      <button id="restart-btn" style="display:none;">Restart Quiz</button>
      <div id="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
